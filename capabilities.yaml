# 能力账本：全量能力清单，初始化全部 missing，只追加不删除。
# status 只能由 `npm run check-capabilities -- --write` 依据证据生成；人工只能写 missing。
# verified 需要三份证据同时成立：implementation 与 consumer 路径存在、
# 消费者的通过记录、artifacts/real-runs/<id>.json 含日期／session id／关键回执。
version: 1
capabilities:
  - id: runtime.load
    title: 插件／预设加载，注册 story_next，client 骨架可见
    reference: inkos:packages/core/src/harness/runtime.ts
    dsh: bundle/preset + client
    implementation: storycraft/src/index.ts
    consumer: storycraft/tests/tools.test.mjs
    realRun: artifacts/real-runs/runtime.load.json
    status: verified
  - id: workspace.single-form
    title: 工作区只承载一种形态，预设声明 form 并校验
    reference: inkos:packages/core/src/harness/builtin-profiles.ts
    dsh: preset + storage
    implementation: storycraft/src/storage/repositories/catalog.ts
    consumer: storycraft/tests/workspace-form.test.mjs
    realRun: artifacts/real-runs/workspace.single-form.json
    status: verified
  - id: runtime.session-binding
    title: 工作区 form + 预设绑定当前作品；绑定后不可原地改绑
