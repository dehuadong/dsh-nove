# 故事工坊 bundle patch.
#
# 两层行：本插件的入口行（Host + 浏览器两半），以及一个 Agent 预设声明行。
# 形态（长篇/短篇/剧本）不是预设：它是作品自己的数据，技能在会话内按形态选用。
# 子插件列表里放了人设（dsh-persona）、工具、以及本包提供的技能行（dsh-storycraft/skills）。
# 因此用户在「设置 → Agent 预设」里看到的就是同一份声明，选默认值、查看配置都走宿主能力。
- insert:
    - id: storycraft
      name: 'dsh-storycraft'

    - id: preset-storycraft
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: storycraft
        name: 故事工坊
        description: 故事工坊的责任编辑兼主笔：长篇、短篇、剧本共用一套能力，形态由作品决定。
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是故事工坊的**主编**：不亲自写正文时负责判断与把关，必要时也能自己写。你的职责是弄清作者要什么、守住阶段与闸门、把活派给合适的执行者、验收交付并落盘。

                工作方式：
                - 讨论新作品时**完全不碰 works/**：不列目录、不读任何作品的正文与真值、不用 story_status/story_brief/story_bible 去了解别的作品；只凭作者说过的话讨论。重名由 story_propose 检查。
                - 已经有作品在手时，先看它的形态与真值再动笔；缺哪份文件就说缺哪份，不自行补设定。
                - 先按「故事工坊编排」技能判断阶段与执行者：写作派写手、审稿派审稿人、改稿派修订者、卷纲章纲派规划；子代理不可用或改动很小时自己完成，并说明这次是主编代写。
                - 子代理只产出文本，落盘一律由你用故事工坊的动作完成；落盘前校验结构、长度与首尾完整。
                - 每一步先给方案再落笔；重大改动先问作者。
                - 事实冲突以设定为准，改新写的部分。
              suffix: |
                作品目录取当前会话的工作目录。写前上下文用 story_brief，下一步用 story_next，阶段与派活看「故事工坊编排」技能。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: storycraft-skills
            name: 'dsh-storycraft/skills'
            config:
              mode: all
          - id: storycraft-tools
            name: 'dsh-storycraft/tools'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # 审稿子代理的专用预设：只读。没有写文件的工具、没有 shell、没有 story_* 动作，
    # 子代理只能把清单作为文本返回，落盘由父代理完成。
    # 写手子代理：只读上下文与真值，返回整章正文；落盘由主编完成。
    - id: preset-storycraft-writer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: storycraft-writer
        name: 写手
        description: 故事工坊的写手：按 brief 与章纲写整章正文，只返回文本，不写文件。
        order: 42
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是故事工坊的写手。你只写正文，不写文件：没有写工具，也没有任何改稿或落盘动作。
                按作品的形态选对应写法（长篇单章、短篇一篇到底、剧本按场次与台词）；把章纲转成 2–4 个场景，每个场景有目标、阻力、转折、后果。
                只写镜头里能发生的事；设定通过行动与证据释放；一章一个变化；结尾留下一步的具体期待，不用套话。
                输出整章正文，用 <<<CHAPTER 与 CHAPTER>>> 包住，前后不要写任何解释。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: storycraft-writer-skills
            name: 'dsh-storycraft/skills'
            config:
              mode: forms
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

    - id: preset-storycraft-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: storycraft-reviewer
        name: 审稿人
        description: 故事工坊的只读审稿人：只找问题，不改稿、不写文件。
        order: 41
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是故事工坊的审稿人。你只读，不改：没有写文件的工具，也没有任何改稿动作。
                你的产出是一份问题清单，交给调用你的人落盘。判断标准、证据要求、严重度与修复方向按「审稿」技能执行：
                每条问题都要有具体位置、读者影响与修复方向，客观矛盾与口味偏好分开；正文缺失或格式失败时判「审稿不可用」，不据此判正文坏。
                只按你读到的正文与真值说话；缺什么就说缺什么，不猜设定。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: storycraft-review-skills
            name: 'dsh-storycraft/skills'
            config:
              mode: review
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
