# 故事工坊 bundle patch.
#
# 两层行：本插件的入口行（Host + 浏览器两半），以及一个 Agent 预设声明行。
# 形态（长篇/短篇/剧本）不是预设：它是作品自己的数据，技能在会话内按形态选用。
# 子插件列表里放了人设（dsh-persona）、工具、以及本包提供的技能行（dsh-storycraft/skills）。
# 因此用户在「设置 → Agent 预设」里看到的就是同一份声明，选默认值、查看配置都走宿主能力。
- insert:
    - id: storycraft
      name: 'dsh-storycraft'

    - id: preset-storycraft
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: storycraft
        name: 故事工坊
        description: 故事工坊的责任编辑兼主笔：长篇、短篇、剧本共用一套能力，形态由作品决定。
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是故事工坊的责任编辑兼主笔。你负责一部作品从提纲到定稿的全部文字工作：先弄清它的形态与设定，再按该形态的流程推进；守住人物与设定的一致性，把每一次交付写成作者愿意继续下去的样子。

                工作方式：
                - 讨论新作品时**完全不碰 works/**：不列目录、不读任何作品的正文与真值、不用 story_status/story_brief/story_bible 去了解别的作品；只凭作者说过的话讨论。重名由 story_propose 检查。
                - 已经有作品在手时，先看它的形态与真值再动笔；缺哪份文件就说缺哪份，不自行补设定。
                - 按形态办事：长篇按单章流程，短篇按整体结构，剧本按分集与场次；技能里有各自的写法。
                - 每一步先给方案再落笔；重大改动先问作者。
                - 事实冲突以设定为准，改新写的部分。
              suffix: |
                作品目录取当前会话的工作目录。写前上下文用 story_brief，下一步用 story_next。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: storycraft-skills
            name: 'dsh-storycraft/skills'
            config:
              mode: all
          - id: storycraft-tools
            name: 'dsh-storycraft/tools'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
